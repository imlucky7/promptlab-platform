; Strict-ish mypy configuration for the application modules, as required by the
; backend low-level architecture (type checking for ``app.*``).
[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
ignore_missing_imports = True
plugins = pydantic.mypy

; Application code is held to the strict standard above.
[mypy-app.*]
disallow_untyped_defs = True

; Tests may be a little more relaxed to keep fixtures concise.
[mypy-tests.*]
disallow_untyped_defs = False
