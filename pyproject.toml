[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lab-backend"
version = "0.1.0"
description = "Prompt Lab - Travel Planner MVP backend (FastAPI + MongoDB)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prompt Lab Team" }]

# Runtime dependencies. Versions are pinned with lower bounds to allow
# compatible upgrades while keeping the documented stack reproducible.
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "motor>=3.4,<4.0",
    "pymongo>=4.7,<5.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "tiktoken>=0.7,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Development / quality tooling as mandated by the backend architecture doc.
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mongomock-motor>=0.0.29",
    "mypy>=1.10,<2.0",
    "black>=24.4,<25.0",
    "isort>=5.13,<6.0",
    "ruff>=0.5,<1.0",
    "pre-commit>=3.7,<4.0",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
# Only package the application code; tests and scripts stay out of the wheel.
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic but strict-ish rule set: pycodestyle, pyflakes, isort, bugbear,
# comprehensions, pyupgrade and naming conventions.
select = ["E", "F", "I", "B", "C4", "UP", "N", "W"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/Query) in defaults.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
